services:
  db:
    image: mariadb:11
    container_name: icthosp-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: icthospital
      MARIADB_USER: icthospital
      MARIADB_PASSWORD: icthospital
    ports:
      - "33063:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: icthosp-app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    ports:
      - "8082:8000"
    working_dir: /app
    environment:
      # Real environment variables win over .env, so the container talks to the
      # db service while a host-side `php artisan serve` keeps its own setting.
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: icthospital
      DB_USERNAME: icthospital
      DB_PASSWORD: icthospital
    command: php artisan serve --host=0.0.0.0 --port=8000

volumes:
  dbdata:
